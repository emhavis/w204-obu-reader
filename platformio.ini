; W204 OBD reader — PlatformIO configuration
; Build:   pio run -e reader      /   pio run -e simulator
; Upload:  pio run -e reader -t upload
; Web UI:  pio run -e reader -t uploadfs   (files in data/)

[platformio]
default_envs = reader
data_dir = data

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

; Main device: plugs into the car's OBD-II port
[env:reader]
build_src_filter = +<*>

; Bench ECU simulator: second ESP32 that answers OBD/MB requests
[env:simulator]
build_src_filter = -<*> +<../sim/>
